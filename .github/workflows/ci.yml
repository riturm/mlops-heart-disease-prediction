# .github/workflows/ci.yml  (Task 5: CI/CD pipeline)
# Steps: lint -> unit tests -> model training. Fails on any error (clear logs).
name: MLOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src app tests --max-line-length=100 --statistics

      - name: Prepare dataset
        run: python src/data_download.py --source local --in data/processed.cleveland.data --out data/heart_raw.csv

      - name: Run unit tests
        run: pytest -q

      - name: Train model
        run: python src/train.py

      - name: Upload model + figures as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/
            reports/
            mlruns/
