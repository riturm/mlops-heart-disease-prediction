# k8s/deployment.yaml  (Task 7: Kubernetes deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  labels: { app: heart-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: heart-api }
  template:
    metadata:
      labels: { app: heart-api }
    spec:
      containers:
        - name: heart-api
          image: <your-dockerhub-username>/heart-api:latest   # <-- push your image, set this
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
